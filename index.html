<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet"><title>MLBB Tournament – Teman Nongkrong Pamulang</title>
<style>
:root{--cyan:#4bd9ed;--gold2:#ffe09a;--bg:#070b1a;--card:#101a3a;--ink:#f4f6ff;--mut:#9aa6d0;--gold:#f6b72e;--blue:#3d5af1;--line:#24325f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#070b1a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(1200px 600px at 70% -10%,#1b2f7a55,transparent),var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif}
h1,h2,h3{font-family:Impact,'Arial Black',sans-serif;letter-spacing:.5px;margin:0}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0a1230cc;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:44px;border-radius:8px}header nav{margin-left:auto;display:flex;gap:6px}
a.b,button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none}
a.b.on,button.p{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}.hero{padding:28px 0;text-align:center}.hero h1{font-size:clamp(40px,9vw,84px);color:var(--gold);text-shadow:0 4px 0 #0008}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--gold);border-radius:99px;padding:4px 14px;background:#0008}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
input,select{width:100%;padding:10px;margin:4px 0 10px;border-radius:10px;border:1px solid var(--line);background:#0a1230;color:var(--ink);font:inherit}label{font-size:12px;color:var(--mut);letter-spacing:1px}
.qr.big{width:min(320px,100%)!important}.qr{background:#fff;padding:10px;border-radius:12px;width:210px;margin:auto}.qr svg,.qr img{width:100%;display:block}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:#6b4;color:#000}.pill.w{background:var(--gold)}
.br{display:flex;gap:26px;overflow-x:auto;padding:10px 0 20px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:190px}.col h3{font-size:14px;color:var(--gold);text-align:center}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}.m div{padding:6px 10px;display:flex;justify-content:space-between;gap:6px}.m div+div{border-top:1px solid var(--line)}.m .w{background:#f6b72e33;font-weight:700}.m .e{color:#667}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}td img{height:36px;border-radius:6px;cursor:zoom-in}
.hide{display:none!important}.note{color:var(--mut);font-size:12px}
/* arena */
#ar{position:fixed;inset:0;background:#000;z-index:20}#cv{position:absolute;inset:0;width:100%;height:100%}
#ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity 1.3s ease-in-out;pointer-events:none}#v4{transition:opacity .25s!important}
#ar video.on{opacity:1}#hudL{position:absolute;left:14px;top:12px;height:54px;opacity:.9;border-radius:8px;pointer-events:none;z-index:3}
#txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:2;text-align:center}
#txt .big{font:900 min(22vw,300px)/1 Impact,sans-serif;color:var(--gold);text-shadow:0 0 40px #f6b72e,0 10px 0 #5a3a00;animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(3) rotateX(80deg);opacity:0}30%{opacity:1}100%{transform:scale(1) rotateX(0)}}
.vs{display:flex;align-items:center;gap:3vw;font:900 min(8vw,110px)/1 Impact,sans-serif;perspective:900px}.vs span{padding:1vw 3vw;border:3px solid var(--gold);background:#0b1538dd;box-shadow:0 0 40px #3d5af1}
.vs .a{animation:fl 1s cubic-bezier(.2,1.3,.4,1)}.vs .c{animation:fr 1s cubic-bezier(.2,1.3,.4,1)}.vs i{color:var(--gold);font-style:normal;font-size:1.3em;text-shadow:0 0 30px red;animation:pop 1.2s}
@keyframes fl{from{transform:translateX(-120vw) rotateY(70deg)}}@keyframes fr{from{transform:translateX(120vw) rotateY(-70deg)}}
#ctl{position:absolute;right:10px;bottom:10px;width:330px;max-height:92%;overflow:auto;background:#0b1230ee;border:1px solid var(--line);border-radius:14px;padding:12px;z-index:9;transition:.3s}#ctl.min{transform:translateX(105%)}
#ctl .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}#ctl button{padding:6px 10px;font-size:13px}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:16px;align-items:center;padding:8px;background:linear-gradient(#000c,transparent);font:900 28px Impact,sans-serif;z-index:2;pointer-events:none}#hud b{color:var(--gold);font-size:40px}
/* ===== CINEMATIC OPENING: GERBANG ARENA ===== */
#ar .gate{position:absolute;inset:0;z-index:6;display:none;perspective:1000px;perspective-origin:50% 50%;background:#050914;opacity:1;transition:opacity .9s ease-in;overflow:visible}
.gate.g-fade{opacity:0}
.gate-bg{position:absolute;inset:0;overflow:hidden;transform:scale(1);transition:transform 2.6s cubic-bezier(.5,0,.9,.5)}
.gate.g-push .gate-bg{transform:scale(2)}
.gate-glow{position:absolute;inset:0;background:radial-gradient(ellipse 55% 72% at 50% 62%,#fff4cf 0,#ffe09a 9%,#4bd9ed 27%,#10346a 52%,#050914 84%);opacity:0;transition:opacity 3s ease-out 1.2s}
.gate.g-open .gate-glow{opacity:1}
.gate-beams{position:absolute;inset:0;background:repeating-conic-gradient(from -90deg at 50% 62%,#4bd9ed2e 0 3deg,transparent 3deg 11deg);-webkit-mask:radial-gradient(circle at 50% 62%,#000 0,transparent 70%);mask:radial-gradient(circle at 50% 62%,#000 0,transparent 70%);opacity:0;transition:opacity 2.2s ease-out 1.8s}
.gate.g-open .gate-beams{opacity:1}
.gate-floor{position:absolute;left:-40%;right:-40%;bottom:0;height:46%;transform-origin:50% 100%;transform:perspective(420px) rotateX(58deg);background:repeating-linear-gradient(90deg,#4bd9ed77 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,#f4b93666 0 2px,transparent 2px 60px);-webkit-mask:linear-gradient(0deg,#000,transparent 92%);mask:linear-gradient(0deg,#000,transparent 92%);opacity:0;transition:opacity 2s ease-out 1.9s;animation:floorRun 1.2s linear infinite}
.gate.g-open .gate-floor{opacity:1}
.gate.g-push .gate-floor{animation-duration:.35s}
@keyframes floorRun{to{background-position:0 0,0 60px}}
.gate-cam{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 2.5s cubic-bezier(.5,0,.92,.55);will-change:transform}
.gate.g-push .gate-cam{transform:translateZ(900px)}
.gate-frame{position:absolute;inset:0;border:clamp(8px,1.5vmin,16px) solid;border-image:linear-gradient(180deg,#ffe09a,#b68a32 40%,#f4b936 70%,#7a5a1c) 1;box-shadow:inset 0 0 60px #000a;pointer-events:none;transform:translateZ(6px)}
.lintel{position:absolute;left:50%;top:0;transform:translateX(-50%);padding:.55em 2.6em .8em;background:linear-gradient(180deg,#0b1a3a,#08122b);border-bottom:3px solid var(--gold);clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);text-align:center;white-space:nowrap}
.lintel b{display:block;font:900 clamp(15px,2.6vmin,28px) 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.3em;color:var(--gold2);text-indent:.3em}
.lintel span{font:800 clamp(7px,1.1vmin,11px) Inter,Arial,sans-serif;letter-spacing:.4em;color:var(--cyan);text-indent:.4em}
.door{position:absolute;top:0;bottom:0;width:50%;transition:transform 4.6s cubic-bezier(.6,.02,.25,1);backface-visibility:hidden}
.door.l{left:0;transform-origin:0 50%}
.door.r{right:0;transform-origin:100% 50%}
.gate.g-open .door.l{transform:rotateY(80deg)}
.gate.g-open .door.r{transform:rotateY(-80deg)}
.door .face{position:absolute;inset:0;overflow:hidden;--rs:clamp(240px,72vmin,660px);background:repeating-linear-gradient(0deg,transparent 0 58px,#4bd9ed16 58px 60px),linear-gradient(180deg,#14305f 0,#0b1a3a 45%,#070f26 100%);box-shadow:inset 0 0 0 3px #f4b93688,inset 0 0 70px #000c}
.door .face:before{content:"";position:absolute;inset:9% 8% 7% 8%;border:2px solid #4bd9ed77;box-shadow:inset 0 0 40px #4bd9ed1f}
.door .face:after{content:"";position:absolute;top:0;bottom:0;width:clamp(8px,1.4vmin,16px);background:linear-gradient(90deg,#7a5a1c,#ffe09a,#b68a32)}
.door.l .face:after{right:0}
.door.r .face:after{left:0;transform:scaleX(-1)}
.door .ring{position:absolute;top:50%;width:var(--rs);height:var(--rs);margin-top:calc(var(--rs) / -2);border-radius:50%;border:3px solid var(--cyan);box-shadow:0 0 30px #4bd9ed66,inset 0 0 30px #4bd9ed33}
.door.l .ring{right:calc(var(--rs) / -2)}
.door.r .ring{left:calc(var(--rs) / -2)}
.door em{position:absolute;top:50%;transform:translateY(-52%);font:900 clamp(120px,40vmin,420px)/.8 'Barlow Condensed','Arial Narrow',sans-serif;font-style:normal;background:linear-gradient(180deg,#ffe09a,#f4b936 60%,#8a6020);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #f4b93666)}
.door.l em{right:9%}
.door.r em{left:9%}
.door .shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 4.6s ease-in}
.gate.g-open .door .shade{opacity:.62}
.gate.g-charge:not(.g-open) .door .face{animation:doorPulse 1.6s ease-in-out infinite}
@keyframes doorPulse{0%,100%{box-shadow:inset 0 0 0 3px #f4b93688,inset 0 0 70px #000c}50%{box-shadow:inset 0 0 0 3px #ffe09a,inset 0 0 70px #000c,inset 0 0 36px #4bd9ed66}}
.seam{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:linear-gradient(180deg,transparent,#fff 20%,#ffe09a 50%,#4bd9ed 80%,transparent);box-shadow:0 0 26px 8px #ffe09aaa,0 0 80px 20px #4bd9ed66;opacity:0;transform:translateZ(3px)}
.gate.g-charge:not(.g-open) .seam{animation:seamPulse 1.6s ease-in-out infinite}
.gate.g-open .seam{animation:seamFlare 2.6s ease-out forwards}
@keyframes seamPulse{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes seamFlare{0%{opacity:.95;transform:translateZ(3px) scaleX(1)}30%{opacity:1;transform:translateZ(3px) scaleX(16)}100%{opacity:0;transform:translateZ(3px) scaleX(70)}}
#ar .gate{z-index:6}
.bkw{overflow-x:auto;padding:10px 0 26px}.bk{display:flex;min-width:max-content}.kc{width:190px;flex:none}.kc.mid{width:225px;padding:0 20px}
.kc h2{margin:0 0 10px;padding:7px 10px;background:#1c2b63;color:#fff;font-size:17px;border-radius:6px}.kc h2 small{display:block;font:500 11px/1.3 'Segoe UI',sans-serif;opacity:.8;margin-top:3px}
.kb{display:flex;flex-direction:column;height:640px;position:relative}.ks{position:relative;flex:1;display:flex;align-items:center}
.ks.r{padding-right:20px}.ks.l{padding-left:20px}.ks.r::before,.ks.l::before{content:"";position:absolute;top:50%;width:20px;border-top:2px solid var(--line)}.ks.r::before{right:0}.ks.l::before{left:0}
.ks.v::after{content:"";position:absolute;width:2px;height:50%;background:var(--line)}.ks.r.v::after{right:0}.ks.l.v::after{left:0}.ks.o::after{top:50%}.ks.e::after{top:0}
.kc.inL{padding-left:20px}.kc.inR{padding-right:20px}.km{position:relative;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:6px}
.kc.inL .km::before,.kc.inR .km::before{content:"";position:absolute;top:50%;width:20px;border-top:2px solid var(--line)}.kc.inL .km::before{left:-22px}.kc.inR .km::before{right:-22px}
.kc.mid .km.kf::before,.kc.mid .km.kf::after{content:"";position:absolute;top:50%;width:20px;border-top:2px solid var(--gold)}.kc.mid .km.kf::before{left:-22px}.kc.mid .km.kf::after{right:-22px}
.kl{display:block;padding:2px 8px;font:600 11px/1.5 'Segoe UI',sans-serif;color:var(--mut);background:#ffffff10;border-radius:4px 4px 0 0}
.kt{display:flex;align-items:stretch;border-top:1px solid var(--line)}.kn{flex:1;min-width:0;padding:5px 7px;min-height:28px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.kn.m{color:var(--mut);font-style:italic}
.kz{width:30px;text-align:center;padding:5px 0;border-left:1px solid var(--line);font-weight:700;color:var(--gold)}
.km select,.km input{margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;padding:5px 4px!important;font-size:12px!important;color:var(--ink)}.km select{flex:1;min-width:0;width:auto}.km input.kz{width:34px;text-align:center}.km select option{background:#0a1230;color:#fff}
.km.kf{border-color:var(--gold);border-width:2px;background:#2c2514}.km.kf .kl{color:var(--gold);font-weight:700}.k3{position:absolute;left:0;right:0;top:calc(50% + 70px)}.k3 h2{margin-bottom:8px}
#exB,#mnB{position:absolute;top:12px;z-index:12;opacity:.35;padding:6px 12px}#exB{right:12px}#mnB{right:112px}#exB:hover,#mnB:hover{opacity:1}

.vs{font:900 min(7vw,98px)/1 'Montserrat','Segoe UI',sans-serif!important;letter-spacing:.05em;gap:4.5vw!important;perspective:1100px;text-transform:uppercase}
.vs span{border:0!important;box-shadow:none!important;padding:0 .1em!important;background:linear-gradient(180deg,#fff6d6 0%,#f0cf7a 34%,#b98a2f 62%,#f6dc92 100%)!important;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1px 1px 0 #6b4a14) drop-shadow(2px 2px 0 #5f4110) drop-shadow(3px 3px 0 #54380d) drop-shadow(4px 4px 0 #49300b) drop-shadow(0 8px 26px #c8861a99)}
.vs i{font-style:normal!important;font-size:.72em!important;text-shadow:none!important;background:linear-gradient(180deg,#fff,#b9c3dd);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 #20263a) drop-shadow(0 0 22px #ffffffcc)}

:root{--cyan:#f4b936}
.vs span{-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
#ar .gate{background:#050403}
.gate-glow{background:radial-gradient(ellipse 55% 72% at 50% 62%,#fff4cf 0,#ffd979 9%,#b8821f 27%,#3a2708 52%,#050403 84%)!important}
.gate-beams{background:repeating-conic-gradient(from -90deg at 50% 62%,#f4b9362e 0 3deg,transparent 3deg 11deg)!important}
.gate-floor{background:repeating-linear-gradient(90deg,#f4b93677 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,#c8861a66 0 2px,transparent 2px 60px)!important}

.door .face:before{border-color:#f4b93666!important;box-shadow:inset 0 0 40px #f4b9361f!important}
.door .ring{border-color:#ffe09a!important;box-shadow:0 0 30px #f4b93666,inset 0 0 30px #f4b93633!important}

.lintel{background:linear-gradient(180deg,#1a1206,#0a0703)!important}.lintel span{color:#f4b936!important}
@keyframes doorPulse{0%,100%{box-shadow:inset 0 0 0 3px #f4b93688,inset 0 0 70px #000c}50%{box-shadow:inset 0 0 0 3px #ffe09a,inset 0 0 70px #000c,inset 0 0 36px #f4b93666}}
#ctl.min~#mnB{opacity:1;background:var(--gold);color:#111;font-weight:700}#mnB{right:150px!important}#v1{z-index:7}#hudL{z-index:8!important}
/* ===== tambahan: registrasi, sertifikat, tombol arena ===== */
#exB,#mnB{display:none!important}
.mrow{display:grid;grid-template-columns:1.5fr 1.2fr .9fr;gap:6px}.mrow input{margin:0 0 8px;min-width:0}

<p class="note" style="margin:2px 0 8px">Isi nama (IGN), ID Game, dan Server ID. Total 5 pemain (1 ketua + 4 anggota), tanpa pemain cadangan.</p>
${[0,1,2,3,4].map(i=>`<label>${i?'ANGGOTA '+i:'KETUA TIM'}</label><div class="mrow"><input name="m${i}n" required maxlength="24" placeholder="Nama / IGN"><input name="m${i}i" required inputmode="numeric" pattern="[0-9]{6,14}" placeholder="ID Game" title="Hanya angka"><input name="m${i}s" required inputmode="numeric" pattern="[0-9]{3,6}" placeholder="Server ID" title="Hanya angka"></div>`).join('')}<label>BUKTI PEMBAYARAN (gambar)</label><input type="file" name="pf" accept="image/*" required><button class="p" style="width:100%">Kirim Pendaftaran</button><p id="msg" class="note"></p></form></div>
<div class="card" style="text-align:center"><h2>PEMBAYARAN QRIS</h2><p>Biaya daftar <b style="color:var(--gold)">${rp(FEE)}</b> / tim</p><div class="qr big">${qr()}</div><p class="note">${QRIS_IMG?'Scan QRIS lalu unggah bukti bayar.':'QR DEMO – ganti dengan QRIS asli (konstanta QRIS_IMG).'}</p></div></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=e.target,fd=new FormData(f),msg=$('#msg');if(T.length>=MAX){msg.textContent='Slot penuh.';return}msg.textContent='Mengirim…';
   try{const mem=[0,1,2,3,4].map(i=>({n:String(fd.get('m'+i+'n')).trim(),id:String(fd.get('m'+i+'i')).trim(),sv:String(fd.get('m'+i+'s')).trim()}));if(new Set(mem.map(x=>x.id+'/'+x.sv)).size<5){msg.textContent='ID Game + Server ID tiap pemain tidak boleh sama.';return}const proof=await shrink(fd.get('pf'));const t={id:'t'+Date.now(),name:fd.get('n').trim(),cap:mem[0].n,wa:fd.get('w'),pl:mem.map(x=>x.n),mem,proof,ok:false,ts:Date.now()};await saveTeam(t);f.reset();msg.textContent='✅ Terkirim! Tim kamu masuk braket. Admin akan verifikasi pembayaran.';location.hash='#braket'}catch(x){msg.textContent='Gagal: '+(x.message||x)}}}
 if(p=='braket')m.innerHTML=`<h2>BRAKET PERTANDINGAN</h2><p class="note">Hanya dapat dilihat. Jadwal & lawan diatur oleh panitia.</p>${bracketHTML(false)}`;
 if(p=='tim')m.innerHTML=`<h2>TIM TERDAFTAR (${T.length}/${MAX})</h2><div class="grid">${T.map(t=>`<div class="card"><b>${esc(t.name)}</b> <span class="pill ${t.ok?'':'w'}">${t.ok?'Terverifikasi':'Menunggu'}</span><div class="note">${(t.mem?t.mem.map((x,i)=>(i?'':'★ ')+esc(x.n)):t.pl.map(esc)).join(' · ')}</div></div>`).join('')||'<p class="note">Belum ada tim.</p>'}</div>`;
 if(p=='admin'){if(!isAdm){m.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><h2>LOGIN ADMIN</h2><p class="note">Masukkan PIN panitia untuk membuka panel admin & live arena.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN admin" autocomplete="off" onkeydown="if(event.key=='Enter')loginPin()" style="text-align:center;font-size:20px;letter-spacing:6px"><button class="p" style="width:100%" onclick="loginPin()">Masuk</button><p id="pinMsg" class="note" style="color:#ff7b7b"></p></div>`;return}
  m.innerHTML=`<h2>PANEL ADMIN</h2><p><a class="b p" href="#arena">▶ BUKA LIVE ARENA</a> <a class="b" href="#layar">Layar proyektor</a> <button onclick="logout()">Keluar admin</button></p>
<div class="card" style="margin:14px 0"><h3>CETAK SERTIFIKAT</h3><p class="note">Ketik nama tim (Juara 1/2/3) atau nama pemain (MVP), pilih jenis sertifikat, lalu klik cetak.</p>
<div class="crow"><input id="cn" list="cnl" maxlength="40" placeholder="Nama tim / nama pemain" value="${esc(window._cert.n)}" oninput="window._cert.n=this.value"><datalist id="cnl">${T.map(t=>`<option value="${esc(t.name)}">`).join('')}${T.map(t=>(t.mem||[]).map(x=>`<option value="${esc(x.n)}">`).join('')).join('')}</datalist>
<select id="ct" onchange="window._cert.t=this.value">${[['j1','Juara 1'],['j2','Juara 2'],['j3','Juara 3'],['mvp','MVP']].map(([v,l])=>`<option value="${v}"${window._cert.t==v?' selected':''}>${l}</option>`).join('')}</select>
<button class="p" onclick="cetakSert()">🖨 Cetak Sertifikat</button></div></div>
<div class="card" style="overflow:auto"><table><tr><th>Tim</th><th>Ketua & Anggota (ID · Server)</th><th>Kontak</th><th>Bukti</th><th>Status</th><th></th></tr>${T.map(t=>`<tr><td>${esc(t.name)}</td><td>${memAdm(t)}</td><td>${esc(t.wa)}</td><td><img src="${getProof(t)}" onclick="zoom('${t.id}')"></td><td>${t.ok?'✅':'⏳'}</td><td><button onclick="ver('${t.id}',${!t.ok})">${t.ok?'Batal':'Verifikasi'}</button> <button onclick="del('${t.id}')">Hapus</button></td></tr>`).join('')}</table></div><h3 style="margin-top:22px">BRAKET (pilih tim lewat dropdown, isi skor di kotak kecil)</h3><p><button onclick="autoFill()">Isi 32 Besar otomatis dari pendaftar</button> <button onclick="resetB()">Kosongkan braket</button></p>${bracketHTML(true)}`}}
window.loginPin=()=>{if($('#pin').value===PIN){ls.s('tn_adm',1);isAdm=true;m_r()}else{$('#pinMsg').textContent='PIN salah.';$('#pin').value=''}};window.logout=()=>{ls.s('tn_adm',0);isAdm=false;location.hash='#daftar';m_r()};window.zoom=id=>{const w=open();w.document.write(`<img src="${getProof(T.find(t=>t.id==id))}" style="max-width:100%">`)};
window.ver=async(id,v)=>{const t=T.find(x=>x.id==id);t.ok=v;await saveTeam(t);m_r()};window.del=async id=>{if(!confirm('Hapus tim?'))return;if(col){await col.doc(id).delete();await db.collection('proofs').doc(id).delete()}else{T=T.filter(t=>t.id!=id);ls.s('tn_t',T)}m_r()};
const m_r=()=>{$('#mn').dataset.p='';render()};
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no('baca file gagal');r.onload=()=>{const i=new Image();i.onerror=()=>no('bukan gambar');i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>150000&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}ok(d)};i.src=r.result};r.readAsDataURL(file)})}
addEventListener('hashchange',()=>{$('#mn').dataset.p='';render()});
init();
</script></body></html>
